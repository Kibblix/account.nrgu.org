<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Account</title>

    <style>
        :root {
            --blue: #1e6bff;
            --red: #e03131;
            --text: #222;
            --muted: #888;
            --line: #ececec;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background: white;
            color: var(--text);
            text-align: center;
        }

        #back {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 6px 0;
            font-size: 14px;
            color: var(--muted);
            text-decoration: none;
        }

        #back:hover { color: var(--text); }

        .pill {
            padding: 10px 22px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 999px;
            border: 1px solid #ddd;
            background: white;
            color: var(--text);
            cursor: pointer;
            transition: background 0.15s;
        }

        .pill:hover { background: #f6f6f6; }

        #topAuth {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 7px 16px;
            font-size: 14px;
        }

        main {
            max-width: 520px;
            margin: 100px auto 40px;
        }

        h1 {
            font-size: 44px;
            font-weight: 600;
            margin: 0 0 10px;
        }

        .subtitle {
            margin: 0 0 40px;
            font-size: 14px;
            color: var(--muted);
        }

        .card {
            padding: 28px 24px;
            border: 1px solid var(--line);
            border-radius: 20px;
            margin-bottom: 24px;
        }

        .card h2 {
            margin: 0 0 16px;
            font-size: 20px;
            font-weight: 600;
        }

        .note {
            margin: 0;
            font-size: 14px;
            color: var(--muted);
            line-height: 1.5;
        }

        #avatar {
            width: 72px;
            height: 72px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--line);
            object-fit: cover;
            display: block;
        }

        #name { font-size: 22px; font-weight: 600; margin: 0 0 4px; word-break: break-word; }
        #email { font-size: 14px; color: var(--muted); margin: 0 0 16px; word-break: break-all; }

        #manage, #create {
            font-size: 14px;
            color: var(--muted);
        }

        #manage:hover, #create:hover { color: var(--text); }

        .poll-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 0;
            border-top: 1px solid var(--line);
            text-align: left;
        }

        .poll-row:first-child { border-top: none; }

        .poll-q { font-size: 16px; font-weight: 600; word-break: break-word; }
        .poll-stats { font-size: 13px; color: var(--muted); }

        .delete-btn {
            flex: none;
            padding: 4px 8px;
            font-size: 13px;
            color: var(--red);
            background: none;
            border: none;
            text-decoration: underline;
            cursor: pointer;
        }

        .delete-btn:hover:not(:disabled) { opacity: 0.8; }
        .delete-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .badge {
            display: inline-block;
            padding: 2px 10px;
            font-size: 12px;
            font-weight: 600;
            color: var(--blue);
            border: 1px solid var(--blue);
            border-radius: 999px;
        }

        .admin-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 10px 0;
            border-top: 1px solid var(--line);
            text-align: left;
            font-size: 14px;
            word-break: break-all;
        }

        .admin-row:first-child { border-top: none; }

        #adminForm {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        #adminEmail {
            flex: 1 1 200px;
            min-width: 0;
            padding: 10px 14px;
            font: inherit;
            font-size: 16px;
            color: var(--text);
            background: white;
            border: 1px solid #ddd;
            border-radius: 14px;
            outline: none;
        }

        #adminEmail:focus { border-color: var(--blue); }

        #msg {
            min-height: 20px;
            margin-top: 12px;
            font-size: 14px;
            color: var(--muted);
        }

        small {
            display: block;
            margin-top: 24px;
            font-size: 12px;
            color: var(--muted);
            line-height: 1.5;
        }

        [hidden] { display: none !important; }
    </style>
</head>
<body>

    <a href="https://nrgu.org" id="back">← Back</a>
    <button id="topAuth" class="pill" hidden>Sign in</button>

    <main>
        <h1>Account</h1>
        <p class="subtitle" id="subtitle">Sign in to manage your account and polls</p>

        <div id="signedOut" hidden>
            <button id="login" class="pill">Sign in with Google</button>
        </div>

        <div id="signedIn" hidden>
            <div class="card">
                <img id="avatar" alt="" referrerpolicy="no-referrer">
                <p id="name"></p>
                <p id="email"></p>
                <p id="role" hidden style="margin:0 0 16px"><span class="badge" id="roleText"></span></p>
                <a id="manage" href="https://myaccount.google.com" target="_blank" rel="noopener">Manage Google account</a>
            </div>

            <div class="card">
                <h2>Your polls</h2>
                <div id="polls"></div>
                <p class="note" style="margin-top:16px">
                    <a id="create" href="https://democracy.nrgu.org">Create a new poll</a>
                </p>
            </div>

            <div class="card" id="adminCard" hidden>
                <h2>Admins</h2>
                <p class="note">Admins can delete any poll. Only you, the owner, can change this list.</p>
                <div id="admins"></div>
                <form id="adminForm">
                    <input id="adminEmail" type="email" placeholder="Google email to add" autocomplete="off">
                    <button id="adminAdd" class="pill" type="submit">Add admin</button>
                </form>
            </div>
        </div>

        <div id="msg"></div>

        <small>
            Your account is your Google account. We only store your polls and votes, not your password.
        </small>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, collection, doc, query, where, getDocs, getDoc, setDoc, deleteDoc, serverTimestamp }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAIPtFw3b-BMaz6hpZfGOrm3Y_WGIG6d34",
            authDomain: "my-base-6f65f.firebaseapp.com",
            projectId: "my-base-6f65f",
            storageBucket: "my-base-6f65f.firebasestorage.app",
            messagingSenderId: "1032034958108",
            appId: "1:1032034958108:web:baab1635dfb0e41ad758d9",
            measurementId: "G-X9Z61B7GKV"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const $ = id => document.getElementById(id);
        const signedOutEl = $("signedOut");
        const signedInEl = $("signedIn");
        const pollsEl = $("polls");
        const msgEl = $("msg");
        const topAuth = $("topAuth");

        function setMsg(text) { msgEl.textContent = text || ""; }

        // ?return=https://something.nrgu.org sends you back after signing in.
        // Only https://nrgu.org and its subdomains are accepted.
        function validReturn() {
            const r = new URLSearchParams(location.search).get("return");
            if (!r) return null;
            try {
                const u = new URL(r);
                if (u.protocol === "https:" && (u.hostname === "nrgu.org" || u.hostname.endsWith(".nrgu.org"))) {
                    return u.href;
                }
            } catch (e) { /* ignore */ }
            return null;
        }

        const returnUrl = validReturn();
        if (returnUrl) {
            $("back").href = returnUrl;
            $("back").textContent = "← Back to " + new URL(returnUrl).hostname;
        }

        async function renderPolls(uid) {
            pollsEl.textContent = "Loading...";

            try {
                const snap = await getDocs(query(collection(db, "polls"), where("creatorUid", "==", uid)));

                const docs = snap.docs.slice().sort((a, b) => {
                    const ta = a.data().createdAt && a.data().createdAt.toMillis ? a.data().createdAt.toMillis() : 0;
                    const tb = b.data().createdAt && b.data().createdAt.toMillis ? b.data().createdAt.toMillis() : 0;
                    return tb - ta;
                });

                pollsEl.textContent = "";

                if (!docs.length) {
                    const p = document.createElement("p");
                    p.className = "note";
                    p.textContent = "You haven't created any polls yet.";
                    pollsEl.append(p);
                    return;
                }

                docs.forEach(d => {
                    const data = d.data();

                    const row = document.createElement("div");
                    row.className = "poll-row";

                    const left = document.createElement("div");
                    const q = document.createElement("div");
                    q.className = "poll-q";
                    q.textContent = data.question;
                    const stats = document.createElement("div");
                    stats.className = "poll-stats";
                    stats.textContent = `Yes ${data.yesVotes || 0} · No ${data.noVotes || 0}`;
                    left.append(q, stats);

                    const btn = document.createElement("button");
                    btn.className = "delete-btn";
                    btn.textContent = "Delete";
                    btn.onclick = () => deletePoll(uid, d.id, btn);

                    row.append(left, btn);
                    pollsEl.append(row);
                });
            } catch (e) {
                console.error(e);
                pollsEl.textContent = "";
                setMsg("Couldn't load your polls: " + (e.code || e.message));
            }
        }

        async function deletePoll(uid, pollId, btn) {
            if (!confirm("Delete this poll? This can't be undone.")) return;

            btn.disabled = true;
            setMsg("Deleting...");
            try {
                await deleteDoc(doc(db, "polls", pollId));
                setMsg("");
                await renderPolls(uid);
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                setMsg("Couldn't delete poll: " + (err.code || err.message));
            }
        }

        // ---------- Admin roles ----------
        // Owner: set in the Firestore rules. Can read and change the admins list.
        // Admin: an email listed in the "admins" collection. Can delete any poll.

        let roleToken = 0;

        function drawAdmins(emails) {
            const el = $("admins");
            el.textContent = "";

            if (!emails.length) {
                const p = document.createElement("p");
                p.className = "note";
                p.textContent = "No other admins yet.";
                el.append(p);
                return;
            }

            emails.forEach(email => {
                const row = document.createElement("div");
                row.className = "admin-row";

                const label = document.createElement("span");
                label.textContent = email;

                const btn = document.createElement("button");
                btn.className = "delete-btn";
                btn.textContent = "Remove";
                btn.onclick = () => removeAdmin(email, btn);

                row.append(label, btn);
                el.append(row);
            });
        }

        async function refreshAdmins() {
            try {
                const snap = await getDocs(collection(db, "admins"));
                drawAdmins(snap.docs.map(d => d.id).sort());
            } catch (e) {
                console.error(e);
                setMsg("Couldn't load admins: " + (e.code || e.message));
            }
        }

        async function loadRole() {
            const token = ++roleToken;
            $("role").hidden = true;
            $("adminCard").hidden = true;

            // Only the owner is allowed to read the admins list.
            try {
                const snap = await getDocs(collection(db, "admins"));
                if (token !== roleToken) return;
                $("roleText").textContent = "Owner";
                $("role").hidden = false;
                $("adminCard").hidden = false;
                drawAdmins(snap.docs.map(d => d.id).sort());
                return;
            } catch (e) { /* not the owner */ }

            // Only admins (and the owner) are allowed to read this document.
            try {
                await getDoc(doc(db, "admin", "check"));
                if (token !== roleToken) return;
                $("roleText").textContent = "Admin";
                $("role").hidden = false;
            } catch (e) { /* regular user */ }
        }

        $("adminForm").onsubmit = async e => {
            e.preventDefault();

            const input = $("adminEmail");
            const addBtn = $("adminAdd");
            const email = input.value.trim().toLowerCase();

            if (!/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(email)) {
                setMsg("Enter a valid email address.");
                return;
            }

            addBtn.disabled = true;
            setMsg("Adding...");
            try {
                await setDoc(doc(db, "admins", email), { email, addedAt: serverTimestamp() });
                input.value = "";
                setMsg("");
                await refreshAdmins();
            } catch (err) {
                console.error(err);
                setMsg("Couldn't add admin: " + (err.code || err.message));
            }
            addBtn.disabled = false;
        };

        async function removeAdmin(email, btn) {
            if (!confirm("Remove " + email + " as admin?")) return;

            btn.disabled = true;
            setMsg("Removing...");
            try {
                await deleteDoc(doc(db, "admins", email));
                setMsg("");
                await refreshAdmins();
            } catch (err) {
                console.error(err);
                btn.disabled = false;
                setMsg("Couldn't remove admin: " + (err.code || err.message));
            }
        }

        function signIn() {
            setMsg("");
            signInWithPopup(auth, new GoogleAuthProvider())
                .then(() => { if (returnUrl) location.href = returnUrl; })
                .catch(err => {
                    console.error(err);
                    if (err.code !== "auth/popup-closed-by-user" && err.code !== "auth/cancelled-popup-request") {
                        setMsg("Couldn't sign in: " + (err.code || err.message));
                    }
                });
        }

        $("login").onclick = signIn;
        topAuth.onclick = () => (auth.currentUser ? signOut(auth) : signIn());

        onAuthStateChanged(auth, user => {
            topAuth.hidden = false;

            if (!user) {
                topAuth.textContent = "Sign in";
                roleToken++;
                signedInEl.hidden = true;
                signedOutEl.hidden = false;
                $("subtitle").textContent = "Sign in to manage your account and polls";
                return;
            }

            topAuth.textContent = "Sign out";
            signedOutEl.hidden = true;
            signedInEl.hidden = false;
            $("subtitle").textContent = "Manage your account and polls";
            setMsg("");

            const avatar = $("avatar");
            if (user.photoURL) {
                avatar.src = user.photoURL;
                avatar.hidden = false;
            } else {
                avatar.hidden = true;
            }
            $("name").textContent = user.displayName || "Signed in";
            $("email").textContent = user.email || "";

            renderPolls(user.uid);
            loadRole();
        });
    </script>

</body>
</html>
